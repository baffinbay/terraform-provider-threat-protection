      minProperties: 1
      properties:
        connectionType:
          type: string
          enum:
            - SECURE
        ipv4:
          type: string
          example: 192.168.1.0
          description: Frontend IPv4
        ipv6:
          type: string
          example: 2001:db8::8a2e:370:7334
          description: Frontend IPv6
        port:
          type: number
          example: 80
          description: Frontend port
        redirectHttp:
          type: boolean
        httpStrictTransportSecurity:
          type: object
          minProperties: 1
          properties:
            enabled:
              type: boolean
              example: true
            maxAge:
              type: number
              example: 1000
            includeSubdomains:
              type: boolean
              example: true
            preload:
              type: boolean
              example: true
        hosts:
          type: array
          items:
            type: object
            required:
              - host
              - certificateId
              - tlsConfig
            properties:
              host:
                type: string
                example: www.example.com
              certificateId:
                type: string
                example: 9eafd907-b85a-4c23-8e24-503758410e24
              tlsConfig:
                type: string
                enum:
                  - ADVANCED
                  - INTERMEDIATE
        clientCertificateVerification:
          oneOf:
            - type: object
              properties:
                mode:
                  type: string
                  enum:
                    - DISABLED
              required:
                - mode
            - type: object
              minProperties: 2
              maxProperties: 3
              properties:
                mode:
                  type: string
                  enum:
                    - VERIFY_AND_REJECT
                verifyCrl:
                  type: boolean
                caCertificateIds:
                  type: array
                  items:
                    type: string
              required:
                - mode
