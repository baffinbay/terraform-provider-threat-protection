name: Build and Test

on:
  push:
    branches: [ master, initial-repo ]
  pull_request:
    branches: [ master, initial-repo ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Provider
        run: go build -v -o terraform-provider-baffinbay .

      - name: Build bb-tool
        run: go build -v -o bb-tool ./cmd/bb-tool/main.go

      - name: Run Unit Tests
        run: go test -v ./...
