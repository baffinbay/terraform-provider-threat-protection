name: Build and Test

on:
  push:
    branches: [ master, initial-repo ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'conductor/**'
      - 'README.md'
      - '.gitignore'
      - 'api-spec/**'
      - 'templates/**'
  pull_request:
    branches: [ master, initial-repo ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'conductor/**'
      - 'README.md'
      - '.gitignore'
      - 'api-spec/**'
      - 'templates/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Gofmt Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Provider
        run: go build -v -o terraform-provider-baffinbay .

      - name: Build bb-tool
        run: go build -v -o bb-tool ./cmd/bb-tool

      - name: Run Go Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Unit Tests
        run: go test -v ./...
